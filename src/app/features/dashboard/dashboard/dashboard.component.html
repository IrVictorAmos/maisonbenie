<div class="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800">
  <!-- Navigation -->
  <nav class="bg-white/10 backdrop-blur-xl border-b border-white/20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
          <h1 class="text-xl font-bold text-white">Maison Bénie</h1>
        </div>
        <button
          (click)="logout()"
          class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition-colors"
        >
          Déconnexion
        </button>
      </div>
    </div>
  </nav>

  <!-- Contenu -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white/10 backdrop-blur-xl rounded-2xl border border-white/20 p-8">
      <h2 class="text-3xl font-bold text-white mb-6">Bienvenue!</h2>
      
      <div *ngIf="currentUser" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-white/5 rounded-lg p-6 border border-white/10">
            <p class="text-gray-400 text-sm mb-2">Nom</p>
            <p class="text-white text-lg font-semibold">{{ currentUser.nom }} {{ currentUser.prenom }}</p>
          </div>
          <div class="bg-white/5 rounded-lg p-6 border border-white/10">
            <p class="text-gray-400 text-sm mb-2">Email</p>
            <p class="text-white text-lg font-semibold">{{ currentUser.email }}</p>
          </div>
          <div class="bg-white/5 rounded-lg p-6 border border-white/10">
            <p class="text-gray-400 text-sm mb-2">Identifiant</p>
            <p class="text-white text-lg font-semibold">{{ currentUser.login }}</p>
          </div>
          <div class="bg-white/5 rounded-lg p-6 border border-white/10">
            <p class="text-gray-400 text-sm mb-2">Rôle</p>
            <p class="text-white text-lg font-semibold">{{ currentUser.role || 'N/A' }}</p>
          </div>
        </div>

        <div class="mt-8 p-6 bg-blue-500/10 border border-blue-500/30 rounded-lg">
          <p class="text-blue-200">
            ✓ Vous êtes connecté avec succès à l'application Maison Bénie
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
